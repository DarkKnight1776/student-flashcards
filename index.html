<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A&P1 Flashcards</title>
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
      :root {
        --ink: #1d1d1f;
        --sub: #6e6e73;
        --paper: #ffffff;
        --line: #e5e5ea;
        --accent: #34795c;
        --accent-soft: #34795c22;
        --bg1: #f5f5f7;
        --bg2: #e9ece9;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
        --shadow-lg:
          0 2px 6px rgba(0, 0, 0, 0.06), 0 16px 40px rgba(0, 0, 0, 0.1);
      }
      [data-theme="dark"] {
        --ink: #f5f5f7;
        --sub: #98989d;
        --paper: #1c1c1e;
        --line: #2c2c2e;
        --accent: #6f2877;
        --accent-soft: #6f2877;
        --bg1: #0b0d0c;
        --bg2: #141917;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.4);
        --shadow-lg:
          0 2px 6px rgba(0, 0, 0, 0.35), 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(1200px 700px at 15% -10%, var(--bg2), transparent),
          radial-gradient(1000px 600px at 110% 10%, var(--bg2), transparent),
          var(--bg1);
        transition: background 0.35s ease;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          Helvetica, Arial, sans-serif;
        color: var(--ink);
      }

      #app {
        max-width: 930px;
        margin: 0 auto;
        padding: 40px 20px 60px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
        position: relative;
      }

      .title {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin: 0;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .counter {
        font-size: 13px;
        font-weight: 500;
        color: var(--sub);
        font-variant-numeric: tabular-nums;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
        color: var(--sub);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .icon-btn:hover {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .theme-menu {
        position: absolute;
        top: 40px;
        right: 0;
        z-index: 10;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        min-width: 130px;
        overflow: hidden;
        padding: 6px;
      }

      .theme-menu button {
        display: block;
        width: 100%;
        text-align: left;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        padding: 9px 10px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .theme-menu button:hover {
        background: var(--accent-soft);
      }
      .theme-menu button.active {
        background: var(--accent);
        color: white;
      }

      .layout {
        display: flex;
        gap: 22px;
        align-items: flex-start;
      }

      .main {
        flex: 1;
        min-width: 0;
      }

      .flip-outer {
        perspective: 1600px;
      }

      .card {
        position: relative;
        min-height: 408px;
        cursor: pointer;
        user-select: none;
        transform-style: preserve-3d;
        transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .card.flipped {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        background: var(--paper);
        border-radius: 22px;
        box-shadow: var(--shadow-lg);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 36px 32px;
        border: 1px solid var(--line);
      }

      .face.back {
        transform: rotateY(180deg);
      }

      .face-label {
        position: absolute;
        top: 18px;
        left: 22px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--sub);
      }

      .face-text {
        line-height: 1.5;
        margin: 0;
        max-width: 560px;
        white-space: pre-wrap;
        letter-spacing: -0.01em;
      }
      .face-text.term {
        font-size: 38px;
        font-weight: 620;
      }
      .face-text.def {
        font-size: 32px;
        font-weight: 420;
      }

      .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 26px;
      }

      .ctrl-btn {
        font-family: inherit;
        font-size: 15px;
        font-weight: 550;
        padding: 11px 20px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        box-shadow: var(--shadow);
        transition:
          transform 0.1s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }
      .ctrl-btn:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-lg);
      }
      .ctrl-btn:active {
        transform: translateY(0) scale(0.97);
      }

      .ctrl-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
        padding: 11px 30px;
      }

      .arrow-btn {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .hint {
        text-align: center;
        font-size: 12px;
        color: var(--sub);
        margin-top: 18px;
        letter-spacing: 0.01em;
      }

      .empty-state {
        border: 1.5px dashed var(--line);
        border-radius: 22px;
        padding: 80px 20px;
        text-align: center;
        color: var(--sub);
        font-size: 15px;
      }

      .sidebar {
        width: 168px;
        flex-shrink: 0;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        box-shadow: var(--shadow);
      }

      .sidebar-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--sub);
        margin-bottom: 12px;
      }

      .quiz-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .quiz-btn {
        font-family: inherit;
        font-size: 14px;
        font-weight: 520;
        text-align: left;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease,
          transform 0.1s ease;
      }
      .quiz-btn:hover {
        border-color: var(--accent);
        transform: translateX(1px);
      }
      .quiz-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      .select-all {
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        margin-top: 14px;
        padding: 0;
        border: none;
        background: none;
        color: var(--accent);
        cursor: pointer;
      }
      .select-all:hover {
        text-decoration: underline;
      }

      .loading,
      .error {
        text-align: center;
        color: var(--sub);
        font-size: 14px;
        padding: 60px 0;
      }
    </style>
  </head>
  <body data-theme="light">
    <div id="app"></div>

    <script>
      let allCards = [];
      let cards = [];
      let index = 0;
      let flipped = false;
      let loaded = false;
      let loadError = false;
      let menuOpen = false;

      const THEME_KEY = "ap1-theme";
      const QUIZ_KEY = "ap1-selected-quizzes";
      const QUIZ_LABELS = {
        "Quiz 1": "Quiz 1 (a- to dys-)",
        "Quiz 2": "Quiz 2 (ec- to neo-)",
        "Quiz 3": "Quiz 3 (nephro- to zyg-)",
        "Quiz 4": "Quiz 4 (-able to -zyme)",
      };
      function quizLabel(q) {
        return QUIZ_LABELS[q] || q;
      }
      let theme = localStorage.getItem(THEME_KEY) || "light";
      let selectedQuizzes = null;

      const app = document.getElementById("app");

      function applyTheme() {
        document.body.setAttribute("data-theme", theme);
      }

      function setTheme(name) {
        theme = name;
        localStorage.setItem(THEME_KEY, theme);
        menuOpen = false;
        applyTheme();
        render();
      }

      function toggleMenu() {
        menuOpen = !menuOpen;
        render();
      }

      function esc(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function getQuizList() {
        const seen = [];
        for (const c of allCards) {
          const q = c.quiz || "Unsorted";
          if (!seen.includes(q)) seen.push(q);
        }
        return seen;
      }

      function applyFilter() {
        cards = allCards.filter(
          (c) => selectedQuizzes.has(c.quiz || "Unsorted") && c.term && c.def,
        );
        index = 0;
        flipped = false;
      }

      function toggleQuiz(name) {
        if (selectedQuizzes.has(name)) {
          if (selectedQuizzes.size > 1) selectedQuizzes.delete(name);
        } else {
          selectedQuizzes.add(name);
        }
        localStorage.setItem(QUIZ_KEY, JSON.stringify([...selectedQuizzes]));
        applyFilter();
        render();
      }

      function selectAllQuizzes() {
        selectedQuizzes = new Set(getQuizList());
        localStorage.setItem(QUIZ_KEY, JSON.stringify([...selectedQuizzes]));
        applyFilter();
        render();
      }

      async function load() {
        try {
          const res = await fetch("cards.json");
          allCards = await res.json();

          const quizList = getQuizList();
          let saved = null;
          try {
            const raw = localStorage.getItem(QUIZ_KEY);
            if (raw) saved = JSON.parse(raw);
          } catch (e) {}

          if (
            saved &&
            saved.length &&
            saved.every((q) => quizList.includes(q))
          ) {
            selectedQuizzes = new Set(saved);
          } else {
            selectedQuizzes = new Set(quizList);
          }
          applyFilter();
        } catch (e) {
          loadError = true;
        }
        loaded = true;
        render();
      }

      function next() {
        if (!cards.length) return;
        index = (index + 1) % cards.length;
        flipped = false;
        render();
      }

      function prev() {
        if (!cards.length) return;
        index = (index - 1 + cards.length) % cards.length;
        flipped = false;
        render();
      }

      function flip() {
        if (!cards.length) return;
        flipped = !flipped;
        render();
      }

      function render() {
        if (!loaded) {
          app.innerHTML = `<div class="loading">Loading cards…</div>`;
          return;
        }

        if (loadError) {
          app.innerHTML = `<div class="error">Couldn't load cards.json — make sure it's in the same folder as this page.</div>`;
          return;
        }

        const count = cards.length;
        const card = count ? cards[index] : null;
        const quizList = getQuizList();

        app.innerHTML = `
    <div class="header">
      <h1 class="title">Dr. Maharrey's A&amp;P1 Flash Cards</h1>
      <div class="header-right">
        <span class="counter">${count ? index + 1 + " / " + count : "0 cards"}</span>
        <button id="gearBtn" class="icon-btn" title="Settings">&#9881;</button>
      </div>
      ${
        menuOpen
          ? `
        <div class="theme-menu">
          <button id="lightBtn" class="${theme === "light" ? "active" : ""}">Light</button>
          <button id="darkBtn" class="${theme === "dark" ? "active" : ""}">Dark</button>
        </div>
      `
          : ""
      }
    </div>

    <div class="layout">
      <div class="main">
        ${
          card
            ? `
          <div class="flip-outer">
            <div id="card" class="card ${flipped ? "flipped" : ""}">
              <div class="face front">
                <span class="face-label">Term${card.quiz ? " · " + esc(card.quiz) : ""}</span>
                <p class="face-text term">${esc(card.term)}</p>
              </div>
              <div class="face back">
                <span class="face-label">Definition${card.quiz ? " · " + esc(card.quiz) : ""}</span>
                <p class="face-text def">${esc(card.def)}</p>
              </div>
            </div>
          </div>

          <div class="controls">
            <button id="prevBtn" class="ctrl-btn arrow-btn" title="Previous">&#8592;</button>
            <button id="flipBtn" class="ctrl-btn primary">Flip</button>
            <button id="nextBtn" class="ctrl-btn arrow-btn" title="Next">&#8594;</button>
          </div>

          <p class="hint">Use arrow keys to navigate, space to flip</p>
        `
            : `
          <div class="empty-state">No quizzes selected — pick at least one on the right.</div>
        `
        }
      </div>

      <div class="sidebar">
        <div class="sidebar-label">Study Set</div>
        <div class="quiz-list">
          ${quizList
            .map(
              (q) => `
            <button class="quiz-btn ${selectedQuizzes.has(q) ? "active" : ""}" data-quiz="${esc(q)}">${esc(quizLabel(q))}</button>
          `,
            )
            .join("")}
        </div>
        <button id="selectAllBtn" class="select-all">Select all</button>
      </div>
    </div>
  `;

        if (card) {
          document.getElementById("card").onclick = flip;
          document.getElementById("flipBtn").onclick = flip;
          document.getElementById("prevBtn").onclick = prev;
          document.getElementById("nextBtn").onclick = next;
        }
        document.getElementById("gearBtn").onclick = (e) => {
          e.stopPropagation();
          toggleMenu();
        };
        if (menuOpen) {
          document.getElementById("lightBtn").onclick = () => setTheme("light");
          document.getElementById("darkBtn").onclick = () => setTheme("dark");
        }
        document.querySelectorAll(".quiz-btn").forEach((btn) => {
          btn.onclick = () => toggleQuiz(btn.dataset.quiz);
        });
        document.getElementById("selectAllBtn").onclick = selectAllQuizzes;
      }

      document.addEventListener("click", () => {
        if (menuOpen) {
          menuOpen = false;
          render();
        }
      });

      document.addEventListener("keydown", (e) => {
        const tag = document.activeElement.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        if (e.key === "ArrowRight") next();
        else if (e.key === "ArrowLeft") prev();
        else if (e.key === " ") {
          e.preventDefault();
          flip();
        }
      });

      applyTheme();
      load();
    </script>
  </body>
</html>
